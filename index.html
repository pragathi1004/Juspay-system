<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juspay Premium Dashboard</title>
  <meta name="description" content="A premium, glassmorphic dashboard for Juspay with vibrant gradients and smooth animations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1 class="logo">Juspay</h1>
    <nav class="nav">
      <ul>
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">Transactions</a></li>
        <li><a href="#">Reports</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </nav>
  </header>
  <main class="main-content">
    <section class="card">
      <h2>Today's Sales</h2>
      <p class="metric">$12,345</p>
    </section>
    <section class="card">
      <h2>Active Users</h2>
      <p class="metric">1,234</p>
    </section>
    <section class="card chart">
      <h2>Revenue Trend</h2>
      <canvas id="revenueChart"></canvas>
    </section>
  </main>
  <footer class="footer">
    <p>© 2026 Juspay. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
